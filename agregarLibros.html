<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" type="text/css" href="libros.css">  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de libros</title>
</head>
<body>
    <nav>
        <ul>
            <li><a href="indice.html">Inicio</a></li>
            <li><a href="agregarLibros.html">Agregar libro</a></li>
            <li><a href="librosLeidos.html">Ver libros leídos</a></li>
            <li>Lista de deseos</li>
        </ul>
    </nav>

    <h1>LECTURAS</h1>
    <form id="agregarLibro">
        <div>
        <label for="titulo">Título del libro</label>
        <input id="titulo" type="text" required>
        </div>

        <div>
        <label for="autore">Nombre del autor/autora</label>
        <input id="autore" type="text" required>
        </div>

        <div>
        <label for="genero">Género del libro</label>
        <input id="genero" type="text" required>
        </div>

        <div>
        <label for="anio">Año leído</label>
        <input type="number" id="anio" min="1900" max="2026" value = "2026" required>       
         </div>

        <div>
        <label for="pages">Páginas</label>
        <input id="pages" type="number" required>
        </div>

        <div>
        <label for="valoracion">Valoración </label>
        <input id="valoracion" type="range" min="0" max="5" required>
        </div>
       
        <button type="submit">Leído</button>
        <button type="reset">Limpiar</button>
    </form>
<script src="biblioteca.js"></script>
</body>
</html>
